  ctx.fillStyle='rgba(10,8,16,.9)';ctx.fillRect(W/2-70,H-22,140,16);ctx.strokeStyle=SA;ctx.strokeRect(W/2-69.5,H-21.5,139,15);
  tx('x = '+q.buf+(Math.floor(T*2)%2?'_':''),W/2-62,H-10,'#fff');
  drawOver()}
/* ---------- shared screens ---------- */
function drawOver(){
  const dim=()=>{ctx.fillStyle='rgba(8,6,14,.78)';ctx.fillRect(0,0,W,H)};ctx.font=FONT;
  if(mode==='menu')return drawMenu(dim);
  if(mode==='pause'){dim();ctx.font=BIG;tx('PAUSED',W/2,96,'#fff','center');ctx.font=FONT;tx('ESC resume   R restart   M menu',W/2,124,'#c9c2dd','center')}
  if(mode==='fail'){dim();ctx.font=BIG;tx(game==='beat'?'TRIPPED!':'OVERRUN!',W/2,90,'#ff5c6c','center');ctx.font=FONT;tx('SCORE '+score,W/2,116,'#ffd24a','center');tx('R RETRY     M MENU',W/2,150,'#fff','center')}
  if(mode==='result'){dim();let acc,ln;
    if(game==='beat'){const tot=cnt.p+cnt.g+cnt.m;acc=tot?(cnt.p+cnt.g*.6)/tot:0;ln='PERFECT '+cnt.p+'  GOOD '+cnt.g+'  MISS '+cnt.m}
    else{const tot=q.solved+q.wrong+q.hurt;acc=tot?q.solved/tot:0;ln='SOLVED '+q.solved+'  WRONG '+q.wrong+'  HIT '+q.hurt}
    const rk=acc>=.95?'S':acc>=.85?'A':acc>=.7?'B':'C';
    ctx.font=BIG;tx('RANK '+rk,W/2,56,'#ffd24a','center');ctx.font=FONT;
    tx(DIFF[diff]+'  '+(game==='beat'?'BEAT SYNC':'EQUATIONS'),W/2,76,'#8d86a3','center');
    tx('SCORE '+score+(newBest?'  NEW BEST!':'   BEST '+best),W/2,94,'#fff','center');tx('ACCURACY '+Math.round(acc*100)+'%',W/2,110,'#c9c2dd','center');
    tx(ln,W/2,126,'#c9c2dd','center');tx('MAX COMBO '+maxC,W/2,142,SA,'center');tx('R PLAY AGAIN     M MENU',W/2,172,'#fff','center')}}
function drawMenu(dim){
  dim();UI=[];ctx.font=BIG;tx('BOUNCE BACK',W/2,34,SA,'center');ctx.font=FONT;tx('Pick a category and difficulty',W/2,50,'#c9c2dd','center');
  const C=[['BEAT SYNC','Bounce to the beat','Keys: D F J K'],['EQUATIONS','Solve to bounce back','Type answer + ENTER']];
  for(let c=0;c<2;c++){const x0=c?204:12,y0=62,sel=cat===c;
    ctx.fillStyle=sel?'rgba(255,159,67,.14)':'rgba(255,255,255,.04)';ctx.fillRect(x0,y0,168,116);ctx.strokeStyle=sel?SA:'#3b3550';ctx.strokeRect(x0+.5,y0+.5,167,115);
    tx(C[c][0],x0+84,y0+16,sel?'#fff':'#c9c2dd','center');tx(C[c][1],x0+84,y0+30,'#8d86a3','center');tx(C[c][2],x0+84,y0+42,'#8d86a3','center');
    for(let d=0;d<3;d++){const y=y0+52+d*18,on=sel&&diff===d;ctx.fillStyle=on?SA:'rgba(255,255,255,.07)';ctx.fillRect(x0+14,y,140,15);
      tx(DIFF[d],x0+84,y+11,on?'#1a1020':'#e9e4f5','center');UI.push({x:x0+14,y,w:140,h:15,c,d})}
    tx('BEST '+(bests[(c?'eq':'beat')+diff]||0),x0+84,y0+108,'#ffd24a','center')}
  tx('ARROWS choose   ENTER play   or click',W/2,H-22,'#8d86a3','center');tx('Beat audio offset '+Math.round(off*1000)+'ms  ( [ ] )',W/2,H-10,'#8d86a3','center')}
function draw(){game==='eq'&&mode!=='menu'?drawEq():drawBeat()}
function update(dt){game==='eq'&&mode!=='menu'?updEq(dt):updBeat(dt)}
const startSel=()=>cat===0?startBeat():startEq();
function toMenu(){if(A){playing=false;clearInterval(timer);master.gain.setTargetAtTime(0,A.currentTime,.05);A.resume()}mode='menu';game='beat';S.mode='cap'}
(async()=>{
  SH=await load(SHEET);FL=await load(FLOOR);L=await Promise.all(LAYERS.map(load));
  const [mi,mr,mh,md]=await Promise.all([MIDLE,MRUN,MHIT,MDIE].map(load));
  EM=HUE.map(h=>({idle:tint(mi,h),run:tint(mr,h),hit:tint(mh,h),die:tint(md,h)}));MS=EM.map(m=>m.idle);
  try{await document.fonts.load(FONT);await document.fonts.load(BIG)}catch(e){}
  ctx.imageSmoothingEnabled=false;
  const pause=()=>{if(mode==='play'){mode='pause';if(game==='beat')A.suspend()}else if(mode==='pause'){mode='play';if(game==='beat')A.resume()}};
  addEventListener('keydown',e=>{
    if(mode==='menu'){
      if(e.code==='ArrowLeft'||e.code==='ArrowRight'){cat=1-cat;e.preventDefault()}
      else if(e.code==='ArrowUp'){diff=(diff+2)%3;e.preventDefault()}else if(e.code==='ArrowDown'){diff=(diff+1)%3;e.preventDefault()}
      else if(e.code==='Space'||e.code==='Enter'){e.preventDefault();startSel()}
      else if(e.key==='['||e.key===']'){off+=e.key===']'?.01:-.01;try{localStorage.setItem('bb-off',off)}catch(x){}}
      return}
    if(e.code==='Escape'){pause();return}
    if(mode!=='play'){if(e.code==='KeyR'){game==='beat'?startBeat():startEq()}else if(e.code==='KeyM')toMenu();return}
    if(e.repeat&&e.key!=='Backspace')return;
    if(game==='beat'){if(e.code in KM)pressLane(KM[e.code])}
    else{if(/^[0-9]$/.test(e.key)&&q.buf.length<4)q.buf+=e.key;else if(e.key==='-'&&!q.buf)q.buf='-';else if(e.key==='Backspace')q.buf=q.buf.slice(0,-1);else if(e.key==='Enter')submitEq()}});
  addEventListener('keyup',e=>{if(e.code in KM)down[KM[e.code]]=0});
  addEventListener('keydown',e=>{if(e.code in KM&&game==='beat'&&mode!=='play')down[KM[e.code]]=1});
  addEventListener('blur',pause_blur=()=>{if(mode==='play')pause()});
  cv.addEventListener('pointerdown',e=>{if(mode!=='menu')return;const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,py=(e.clientY-r.top)/r.height*H;
    const u=UI.find(u=>px>=u.x&&px<=u.x+u.w&&py>=u.y&&py<=u.y+u.h);if(u){cat=u.c;diff=u.d;startSel()}});
  let last=performance.now();
  (function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)})(last);
})();
</script></body></html>
